# Relance les tests, construit les images Docker, les teste comme sur le NAS (DSM 7.1), puis les publie
# sur GitHub Container Registry. Le NAS récupère tout seul la dernière publication réussie
# (deploy/update.sh, toutes les 5 minutes) : aucun runner ni port entrant, et GitHub ne peut pas piloter
# le NAS. Une image qui ne démarrerait pas sur le NAS n'est donc jamais publiée.
#
# Tags publiés : sha-xxxxxxx (le commit) et latest.
name: Images

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "web/**"
      - "deploy/**"
      - ".github/docker/**"
      - ".github/workflows/docker.yml"
      - ".github/workflows/images.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-main
  cancel-in-progress: false

jobs:
  api:
    uses: ./.github/workflows/api.yml

  web:
    uses: ./.github/workflows/web.yml

  images:
    name: Images
    needs: [api, web]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml
    with:
      push: true

  summary:
    name: Résumé
    needs: [images]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Images publiées : \`sha-${GITHUB_SHA::7}\` et \`latest\`." >> "$GITHUB_STEP_SUMMARY"
          echo "Le NAS les installera au prochain passage de \`update.sh\` (5 minutes au plus)." >> "$GITHUB_STEP_SUMMARY"
