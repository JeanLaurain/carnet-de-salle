# Relance les tests, puis construit et publie les images Docker sur GitHub Container Registry.
# Le NAS récupère tout seul la dernière publication réussie (deploy/update.sh, toutes les 5 minutes) :
# aucun runner ni port entrant, et GitHub ne peut pas piloter le NAS.
#
# Tags publiés : sha-xxxxxxx (le commit) et latest.
name: Images

on:
  push:
    branches: [main]
    paths: ["api/**", "web/**", "deploy/**", ".github/workflows/images.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-main
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/jeanlaurain/carnet-de-salle

jobs:
  api:
    uses: ./.github/workflows/api.yml

  web:
    uses: ./.github/workflows/web.yml

  images:
    name: Image ${{ matrix.component }}
    needs: [api, web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [api, web]
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.component }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component }}
          file: ${{ matrix.component }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  summary:
    name: Résumé
    needs: [images]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Images publiées : \`sha-${GITHUB_SHA::7}\` et \`latest\`." >> "$GITHUB_STEP_SUMMARY"
          echo "Le NAS les installera au prochain passage de \`update.sh\` (5 minutes au plus)." >> "$GITHUB_STEP_SUMMARY"
