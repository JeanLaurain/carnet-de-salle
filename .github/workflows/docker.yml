# Construit les images Docker de l'API et du front, les teste, puis les publie si demandé.
# Vérifie aussi qu'aucune modification ne casse le déploiement sur le NAS :
#   - les images démarrent et répondent, l'API derrière nginx (.github/docker/test-images.sh) ;
#   - deploy/docker-compose.yml est valide pour docker compose ;
#   - les scripts de deploy/ passent shellcheck.
#
# Appelé par ci.yml (PR : construit et teste, sans publier) et par images.yml (main : publie).
name: Images Docker

on:
  workflow_call:
    inputs:
      push:
        description: Publier les images sur ghcr.io (sha-xxxxxxx et latest)
        type: boolean
        default: false

env:
  IMAGE_PREFIX: ghcr.io/jeanlaurain/carnet-de-salle

jobs:
  deploy-files:
    name: Fichiers de déploiement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: shellcheck
        run: shellcheck deploy/*.sh .github/docker/*.sh

      - name: docker-compose.yml
        run: |
          compose() { docker compose --env-file deploy/.env.example -f deploy/docker-compose.yml "$@"; }
          compose config --quiet
          compose --profile tools config --services

  images:
    name: Construction et test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-api
          tags: |
            type=sha,prefix=sha-,format=short,priority=300
            type=raw,value=latest,enable={{is_default_branch}}

      - id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-web
          tags: |
            type=sha,prefix=sha-,format=short,priority=300
            type=raw,value=latest,enable={{is_default_branch}}

      # load : l'image reste sur le runner pour être testée avant d'être publiée.
      - name: Construire l'API
        uses: docker/build-push-action@v6
        with:
          context: api
          file: api/Dockerfile
          platforms: linux/amd64
          load: true
          tags: |
            ${{ steps.meta-api.outputs.tags }}
            local/carnet-de-salle-api:ci
          labels: ${{ steps.meta-api.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.meta-api.outputs.version }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Construire le front
        uses: docker/build-push-action@v6
        with:
          context: web
          file: web/Dockerfile
          platforms: linux/amd64
          load: true
          tags: |
            ${{ steps.meta-web.outputs.tags }}
            local/carnet-de-salle-web:ci
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Tester les images
        run: |
          bash .github/docker/test-images.sh local/carnet-de-salle-api:ci local/carnet-de-salle-web:ci \
            "${{ steps.meta-api.outputs.version }}"

      - name: Connexion à ghcr.io
        if: inputs.push
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publier
        if: inputs.push
        env:
          TAGS: ${{ steps.meta-api.outputs.tags }} ${{ steps.meta-web.outputs.tags }}
        run: |
          for tag in $TAGS; do
            docker push --quiet "$tag"
          done
