# À usage unique : génère les squelettes officiels (dotnet new, ng new) puis est supprimé.
name: Bootstrap (à supprimer)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v5
        with:
          node-version: "lts/*"

      - name: API .NET (webapi + xunit)
        run: |
          set -eux
          mkdir -p api && cd api
          dotnet new globaljson --sdk-version "$(dotnet --version)" --roll-forward latestFeature
          dotnet new sln -n CarnetDeSalle
          dotnet new webapi -n CarnetDeSalle.Api -o src/CarnetDeSalle.Api
          dotnet new xunit -n CarnetDeSalle.Api.Tests -o tests/CarnetDeSalle.Api.Tests
          SLN="$(ls CarnetDeSalle.sln* | head -n 1)"
          dotnet sln "$SLN" add src/CarnetDeSalle.Api/CarnetDeSalle.Api.csproj tests/CarnetDeSalle.Api.Tests/CarnetDeSalle.Api.Tests.csproj
          dotnet add tests/CarnetDeSalle.Api.Tests/CarnetDeSalle.Api.Tests.csproj reference src/CarnetDeSalle.Api/CarnetDeSalle.Api.csproj
          dotnet add tests/CarnetDeSalle.Api.Tests/CarnetDeSalle.Api.Tests.csproj package Microsoft.AspNetCore.Mvc.Testing
          dotnet build
          dotnet --version

      - name: Front Angular (ng new + PWA)
        run: |
          set -eux
          npx -y @angular/cli@latest new web --routing --style=scss --ssr=false --skip-git --package-manager=npm --defaults --interactive=false
          cd web
          npx ng add @angular/pwa --skip-confirmation --interactive=false
          node -p "process.versions.node.split('.')[0]" > .nvmrc
          npx ng version
          npx ng build

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api web
          git commit -m "chore: squelettes générés (dotnet new webapi/xunit, ng new + PWA)"
          git push
