name: API

on:
  push:
    branches: [main]
    paths: ["api/**", ".github/workflows/api.yml"]
  pull_request:
    paths: ["api/**", ".github/workflows/api.yml"]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build et tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: api/global.json
          cache: true
          cache-dependency-path: api/**/*.csproj

      - name: Restauration
        run: dotnet restore

      - name: Format (dotnet format)
        run: dotnet format --verify-no-changes --no-restore --severity error

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Tests
        run: >
          dotnet test --no-build -c Release
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      - name: Résultats des tests
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: api-test-results
          path: api/TestResults
          if-no-files-found: ignore
