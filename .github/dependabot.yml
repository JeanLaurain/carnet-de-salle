version: 2
updates:
  - package-ecosystem: nuget
    directory: /api
    schedule: { interval: weekly, day: monday }
    groups:
      dotnet:
        patterns: ["*"]
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly, day: monday }
    groups:
      angular:
        patterns: ["@angular/*", "@angular-devkit/*", "@schematics/*"]
      autres:
        patterns: ["*"]
        exclude-patterns: ["@angular/*", "@angular-devkit/*", "@schematics/*"]
    ignore:
      # Les versions majeures d'Angular et de TypeScript se font avec « ng update » (ticket dédié)
      - dependency-name: "@angular/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@angular-devkit/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: ["/api", "/web"]
    schedule: { interval: weekly, day: monday }
    ignore:
      # Le projet reste sur .NET 10 (LTS) : changer de version majeure se fait dans un ticket dédié
      # (TargetFramework, global.json, paquets, CI et Dockerfile ensemble), pas image par image.
      - dependency-name: "dotnet/*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker-compose
    directory: /deploy
    schedule: { interval: monthly }
    ignore:
      # SQL Server reste en 2019 : sur le NAS (noyau Synology 4.4, processeur sans AVX), la 2022 se fige
      # et la 2025 plante au démarrage (docs/deploiement-nas.md, étape 1). La CI ne peut pas le voir :
      # elle tourne sur les machines de GitHub. Le tag 2019-latest suit déjà les mises à jour cumulatives.
      - dependency-name: "mssql/server"
