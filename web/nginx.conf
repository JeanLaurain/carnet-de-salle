# Sert le front Angular et relaie /api vers le conteneur de l'API.
# Placé devant : le reverse proxy DSM (HTTPS) qui envoie X-Forwarded-Proto: https.

map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Photos de repas envoyées à l'API
  client_max_body_size 25m;

  # DNS interne de Docker : l'API peut changer d'adresse à chaque déploiement
  resolver 127.0.0.11 valid=10s ipv6=off;

  location /api/ {
    set $api_upstream http://api:8080;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 120s;
  }

  # Fichiers qui doivent toujours être revalidés (mises à jour de la PWA)
  location = /index.html {
    include /etc/nginx/snippets/securite.conf;
    add_header Cache-Control "no-cache";
  }
  location ~ ^/(ngsw-worker\.js|ngsw\.json|safety-worker\.js|worker-basic\.min\.js)$ {
    include /etc/nginx/snippets/securite.conf;
    add_header Cache-Control "no-cache";
  }
  location = /manifest.webmanifest {
    include /etc/nginx/snippets/securite.conf;
    types { application/manifest+json webmanifest; }
    add_header Cache-Control "no-cache";
  }

  # JS et CSS : noms avec empreinte (outputHashing all), cache long
  location ~* \.(?:js|css)$ {
    include /etc/nginx/snippets/securite.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location ~* \.(?:png|jpg|jpeg|svg|ico|webp|woff2?)$ {
    include /etc/nginx/snippets/securite.conf;
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }

  # Routes de l'appli Angular
  location / {
    include /etc/nginx/snippets/securite.conf;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
